global
    maxconn 1000

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# Dashboard UI
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# Port 5000: chi dinh tuyen ghi (write) den primary node
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1000 fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008

# Port 5001: chi dinh tuyen doc (read) den standby node
listen standbys
    balance roundrobin
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node-1 pg-node-1:5432 maxconn 100 check port 8008
    server pg-node-2 pg-node-2:5432 maxconn 100 check port 8008
    server pg-node-3 pg-node-3:5432 maxconn 100 check port 8008
