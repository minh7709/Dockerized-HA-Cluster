bootstrap:
  dcs:
    postgresql:
      use_pg_rewind: true
  initdb:
    - auth-host: md5
    - auth-local: trust
    - encoding: UTF8
    - data-checksums
  post_init: /tmp/post_init.sh

postgresql:
  bin_dir: /usr/lib/postgresql/14/bin

  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5